<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Objetos perdidos · UNIMINUTO{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/estilos.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="d-flex align-items-center justify-content-between py-2 px-3 px-md-4">
    <div class="d-flex align-items-center gap-3">
      <img src="/static/img/logo.png" alt="UNIMINUTO" class="logo">
      <div class="d-none d-sm-block">
        <div class="brand-title">Objetos perdidos</div>
        <div class="brand-sub">Campus UNIMINUTO</div>
      </div>
    </div>
    {% block acciones_header %}{% endblock %}
  </div>
</header>

<main>
  {% block contenido %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container text-center small">
    Corporación Universitaria Minuto de Dios · Educación de calidad al alcance de todos
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
